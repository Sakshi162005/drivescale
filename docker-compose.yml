services:
  mongodb:
    image: mongo:7.0
    container_name: drivescale-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=drivescale
    volumes:
      - mongodb_data:/data/db
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: drivescale-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MinIO Object Storage service (Phase 12)
  # Self-hosted S3-compatible storage with persistent volume and web console
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: drivescale-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Background Worker service (Phase 7 & 12)
  # Connects to shared Redis, MongoDB, and MinIO infrastructure
  # For local development: run `npm run worker` (or `npm run worker:server`)
  # In containerized deployment:
  # worker:
  #   image: node:20-alpine
  #   container_name: drivescale-worker
  #   working_dir: /app
  #   command: npm run worker --workspace=server
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=production
  #     - MONGODB_URI=mongodb://mongodb:27017/drivescale
  #     - REDIS_URL=redis://redis:6379
  #     - MINIO_ENDPOINT=minio
  #     - MINIO_PORT=9000
  #     - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
  #     - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
  #     - MINIO_BUCKET=drivescale
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   networks:
  #     - drivescale-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  drivescale-network:
    driver: bridge
