services:
  mongodb:
    image: mongo:7.0
    container_name: drivescale-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=drivescale
    volumes:
      - mongodb_data:/data/db
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: drivescale-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Background Worker service (Phase 7)
  # Connects to shared Redis and MongoDB infrastructure
  # For local development: run `npm run worker` (or `npm run worker:server`)
  # In containerized deployment:
  # worker:
  #   image: node:20-alpine
  #   container_name: drivescale-worker
  #   working_dir: /app
  #   command: npm run worker --workspace=server
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=production
  #     - MONGODB_URI=mongodb://mongodb:27017/drivescale
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - drivescale-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  drivescale-network:
    driver: bridge
