services:
  # Public ingress reverse proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: drivescale-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Frontend React SPA container
  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    container_name: drivescale-client
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Express API backend server
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: drivescale-server
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/drivescale
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-drivescale}
      - STORAGE_DRIVER=minio
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-drivescale-production-access-secret-32-chars-min!}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-drivescale-production-refresh-secret-32-chars-min!}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Background worker process
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: drivescale-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/drivescale
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-drivescale}
      - STORAGE_DRIVER=minio
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "node", "dist/worker-health.js"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # MongoDB database
  mongodb:
    image: mongo:7.0
    container_name: drivescale-mongodb
    restart: unless-stopped
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_DATABASE=drivescale
    volumes:
      - mongodb_data:/data/db
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis cache & BullMQ queue
  redis:
    image: redis:7.2-alpine
    container_name: drivescale-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # MinIO Object Storage
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: drivescale-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
    ports:
      # Optional console access for storage management
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - drivescale-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  drivescale-network:
    driver: bridge
